services:
  pg-primary:
    image: postgres:18
    container_name: pg-primary-1
    networks:
      - pg-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zbd-user
      POSTGRES_PASSWORD: zbd-user
      POSTGRES_DB: MedicalApptApp
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=10
    volumes:
      - pg-primary-data:/var/lib/postgresql
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
      - ./backup.dump:/docker-entrypoint-initdb.d/backup.dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zbd-user -d MedicalApptApp"]
      interval: 5s
      timeout: 5s
      retries: 10
  pg-replica-1:
    image: postgres:18
    container_name: pg-replica-1-1
    networks:
      - pg-net
    ports:
      - "5433:5432"
    environment:
      PGUSER: replicator
      PGPASSWORD: replica_pass
    entrypoint: /bin/bash
    command: >
      -c "rm -rf /var/lib/postgresql/data/* &&
          until gosu postgres pg_basebackup -h pg-primary-1 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
          do echo 'Waiting for primary...'; sleep 2;
          done &&
          echo 'primary_slot_name=replica_1_slot' >> /var/lib/postgresql/data/postgresql.auto.conf &&
          chmod 700 /var/lib/postgresql/data &&
          exec gosu postgres postgres -D /var/lib/postgresql/data"
    volumes:
      - pg-replica-1-data:/var/lib/postgresql
    depends_on:
      pg-primary:
        condition: service_healthy
  pg-replica-2:
    image: postgres:18
    container_name: pg-replica-2-1
    networks:
      - pg-net
    ports:
      - "5434:5432"
    environment:
      PGUSER: replicator
      PGPASSWORD: replica_pass
    entrypoint: /bin/bash
    command: >
      -c "rm -rf /var/lib/postgresql/data/* &&
          until gosu postgres pg_basebackup -h pg-primary-1 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
          do echo 'Waiting for primary...'; sleep 2;
          done &&
          echo 'primary_slot_name=replica_2_slot' >> /var/lib/postgresql/data/postgresql.auto.conf &&
          chmod 700 /var/lib/postgresql/data &&
          exec gosu postgres postgres -D /var/lib/postgresql/data"
    volumes:
      - pg-replica-2-data:/var/lib/postgresql
    depends_on:
      pg-primary:
        condition: service_healthy
networks:
  pg-net:
    driver: bridge
volumes:
  pg-primary-data:
  pg-replica-1-data:
  pg-replica-2-data: